name: plataforma-kaqchikel

services:
  postgres:
    image: postgres:18.4-alpine3.23
    container_name: kaqchikel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - data_net

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: kaqchikel-garage
    restart: unless-stopped

    command:
      - /garage
      - server
      - --single-node
      - --default-bucket

    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET}

    ports:
      - "127.0.0.1:3900:3900"

    volumes:
      - ./infrastructure/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

    networks:
      - data_net

volumes:
  postgres_data:
    name: kaqchikel_postgres_data

  garage_meta:
    name: kaqchikel_garage_meta

  garage_data:
    name: kaqchikel_garage_data

networks:
  data_net:
    name: kaqchikel_data_net
    driver: bridge
